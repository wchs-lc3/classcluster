# LC3 worker fleet for balenaOS (Raspberry Pi 3/4).
#
# Two services per device:
#   runner - grades submissions and hosts interactive runs (port 9500)
#   cdn    - mirrors the gateway's heavy static assets and serves them (port 80)
#
# Both use host networking so the gateway sees the device's real LAN address:
# it learns a worker's IP from the heartbeat connection, which is how a DHCP
# address change is handled without touching the dashboard.
#
# Every LC3_* setting is an image default (see balena/*/Dockerfile) so a fleet,
# device, or service variable in the balenaCloud dashboard overrides it with no
# rebuild. Only two must be set before a device is useful:
#   LC3_GATEWAY       the gateway's IP or hostname, e.g. 10.0.0.5
#   LC3_WORKER_TOKEN  contents of /srv/lc3/state/worker_token on the gateway
version: '2.4'

volumes:
  cdn-assets:

services:
  runner:
    build:
      context: .
      dockerfile: balena/worker/Dockerfile
    restart: always
    network_mode: host
    # bwrap needs to unshare namespaces to sandbox student code at all.
    privileged: true
    # The outer cap that systemd's per-job cgroup used to provide. Raise
    # mem_limit on a 2GB+ device; a 1GB Pi 3 should stay near this.
    mem_limit: 768m
    pids_limit: 512
    # Job directories are throwaway and must never touch the SD card.
    # No explicit size= here: balenaOS's newer core-next supervisor rejects
    # that option outright ("unsupported option `size`") and gets stuck
    # retrying the same broken target release forever, which starves every
    # other supervisor operation (including host-config changes) of the
    # locks it needs. mem_limit above still bounds total container memory,
    # tmpfs included.
    tmpfs:
      - /run/lc3-jobs:mode=0700

  cdn:
    build:
      context: .
      dockerfile: balena/cdn/Dockerfile
    restart: always
    network_mode: host
    mem_limit: 192m
    volumes:
      - cdn-assets:/srv/lc3-cdn

  # relay-agent (balena/relay-agent/Dockerfile) is intentionally NOT a
  # service here. It grants real host root to whoever holds DEVICE_TOKEN
  # (see ~/Downloads/remote-relay/README.md) and must never go out in a
  # release that any non-canary device could end up pinned to -- a
  # compose-level "canary-only" comment doesn't stop the container from
  # running (privileged, restart: always) on every device that lands on
  # that release regardless of whether its env vars are set. The canary
  # (a03bf08) is pinned to an older release (fdded6441...) that still has
  # it baked in; that release is not touched by future fleet-wide pushes.
  # To rebuild the canary's image, temporarily add this service back,
  # push, and re-pin only the canary to the resulting release.

  # Persistent SOCKS5 client so the device's OpenVPN (balenaCloud
  # cloudlink) reaches the internet through the trojan tunnel, via
  # balenaOS's own redsocks host-proxy instead of OpenVPN's own
  # socks-proxy support, which does not reliably engage. Configures the
  # host proxy itself at startup through the supervisor-api label below
  # (PATCH /v1/device/host-config) -- no root, no privileged mode, safe
  # to run on any device. Requires TROJAN_* env vars (device or fleet
  # scoped): TROJAN_SERVER_ADDRESS, TROJAN_SERVER_PORT, TROJAN_PASSWORD,
  # TROJAN_SNI.
  #
  # Does NOT fix OpenVPN's own proto (IPv6-first resolution can still
  # hang connection attempts on networks with no IPv6 route) -- that fix
  # requires editing /etc/openvpn/openvpn.conf directly, which has no
  # non-root API. Rolled out to the canary (a03bf08, on an older release
  # with relay-agent's host-root fix instead) and one additional device
  # (empty-potato, 78d76b4) to verify the supervisor-api-only approach
  # works before any wider fleet rollout.
  xray-cloudlink:
    build:
      context: .
      dockerfile: balena/xray-cloudlink/Dockerfile
    restart: always
    network_mode: host
    mem_limit: 64m
    labels:
      io.balena.features.supervisor-api: '1'

  # cloudlink-init (balena/cloudlink-init/Dockerfile) is intentionally NOT
  # a service here, same reasoning as relay-agent above: it's privileged
  # with host pid/network access, so it must only ever exist in a one-off
  # release built and pinned to a specific device. empty-potato (78d76b4)
  # is pinned to a release that has it baked in (c89aedaa...); that
  # release is not touched by future fleet-wide pushes. To reuse it on
  # another device, temporarily add this service back, push, and pin only
  # that device to the resulting release:
  #   cloudlink-init:
  #     build:
  #       context: .
  #       dockerfile: balena/cloudlink-init/Dockerfile
  #     restart: 'no'
  #     privileged: true
  #     pid: host
  #     network_mode: host
  #     mem_limit: 32m
