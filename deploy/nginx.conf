user http;
worker_processes 2;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    include /etc/nginx/lc3-upstream.conf;

    # Plain HTTP on the LAN: a self-signed HTTPS certificate triggers a browser
    # "not secure" interstitial that a classroom will not accept. HTTP keeps the
    # first visit click-free. VS Code webviews need a secure context and are not
    # used; the teacher's admin is native VS Code UI instead.
    server {
        listen 80 default_server;
        server_name _;

        # Single page: login overlay, the VS Code workbench, and the hidden
        # runtime iframe all live here. No separate login/admin/run pages.
        location / {
            root /opt/lc3/web;
            index index.html;
            add_header Cache-Control "no-store";
        }

        # LiveScript sources, fetched and compiled in the browser. Nginx has no
        # type for them and would offer them as a download. A regex location
        # outranks a plain prefix, which is why the prefixes below carry ^~:
        # without it, /ide-ext/lc3/extension.ls lands here, under the wrong
        # root, and the whole extension fails to load.
        location ~ \.ls$ {
            root /opt/lc3/web;
            default_type text/plain;
            add_header Cache-Control "no-store";
        }

        # VS Code web build assets (booted from the page at /).
        location ^~ /ide/ {
            alias /opt/lc3/web/ide/;
            add_header Cache-Control "public, max-age=604800";
        }

        # LC3 web extension (package.json, extension.js, extension.ls).
        location ^~ /ide-ext/ {
            alias /opt/lc3/web/ext/;
            add_header Cache-Control "no-store";
        }

        # Gateway API.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_read_timeout 200s;
            proxy_buffering off;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Heavy runtimes (Pyodide, and CheerpJ if self-hosted): least_conn across
        # Pi 3 CDN workers, local backup when none are up.
        location /heavy/ {
            proxy_pass http://lc3cdn;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_connect_timeout 3s;
        }

        location = /heavy-manifest.txt {
            root /srv/lc3;
            add_header Cache-Control "no-store";
        }
    }

    # Local heavy-asset server: upstream target of last resort and the source
    # workers mirror from during provisioning.
    server {
        listen 127.0.0.1:8081;
        location /heavy/ {
            alias /srv/lc3/heavy/;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }
}
